services:
  # Backend Web Service running FastAPI & serving Frontend
  - type: web
    name: bodhiwaves-growth-os
    env: python
    region: oregon
    plan: standard
    buildCommand: "cd backend && pip install -r requirements.txt && python -m alembic upgrade head"
    startCommand: "cd backend && uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/v1/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: bodhiwaves-postgres
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 120
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: 7
      - key: WHATSAPP_MOCK_MODE
        value: "true"
      - key: WHATSAPP_VERIFY_TOKEN
        generateValue: true

databases:
  - name: bodhiwaves-postgres
    plan: standard
    region: oregon
    databaseName: bodhiwaves_erp
    user: bodhiwaves
